apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudops-config
  namespace: cloudops
  labels:
    app.kubernetes.io/name: cloudops-enterprise-platform
    app.kubernetes.io/part-of: cloudops-enterprise-platform
data:
  APP_NAME: "CloudOps Enterprise Platform"
  APP_ENV: "production"
  DEBUG: "false"
  STORAGE_BACKEND: "local_memory"
  DB_BACKEND: "postgres"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "cloudops_db"
