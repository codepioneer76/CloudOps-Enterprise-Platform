apiVersion: v1
kind: Secret
metadata:
  name: cloudops-secrets
  namespace: cloudops
  labels:
    app.kubernetes.io/name: cloudops-enterprise-platform
    app.kubernetes.io/part-of: cloudops-enterprise-platform
type: Opaque

# ==============================================================================
# PLACEHOLDER SECRET - DO NOT COMMIT REAL CREDENTIALS TO VERSION CONTROL
# ==============================================================================
# All values under `data:` MUST be base64-encoded strings.
# 'Q0hBTkdFX01F' is the base64-encoded representation of the placeholder: 'CHANGE_ME'.
#
# Instructions to encode your actual values:
#   Linux / macOS (bash/zsh):
#     echo -n "your-secret-value" | base64
#
#   Windows (PowerShell):
#     [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("your-secret-value"))
#
# Instructions to decode and verify existing values:
#   Linux / macOS:
#     echo "Q0hBTkdFX01F" | base64 -d
#
#   Windows (PowerShell):
#     [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("Q0hBTkdFX01F"))
#
# Alternatively, you can create this secret directly using kubectl:
#   kubectl create secret generic cloudops-secrets -n cloudops \
#     --from-literal=DB_USER=cloudops_user \
#     --from-literal=DB_PASSWORD=my_secure_password \
#     --from-literal=AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE \
#     --from-literal=AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY \
#     --dry-run=client -o yaml > secret.yaml
# ==============================================================================
data:
  # Database Credentials (base64 of 'CHANGE_ME')
  DB_USER: Q0hBTkdFX01F
  DB_PASSWORD: Q0hBTkdFX01F
  POSTGRES_DB: Q0hBTkdFX01F
  POSTGRES_USER: Q0hBTkdFX01F
  POSTGRES_PASSWORD: Q0hBTkdFX01F

  # Cloud Storage / S3 Credentials (base64 of 'CHANGE_ME')
  AWS_ACCESS_KEY_ID: Q0hBTkdFX01F
  AWS_SECRET_ACCESS_KEY: Q0hBTkdFX01F
