apiVersion: v1
kind: Service
metadata:
  name: cloudops-api-service
  namespace: cloudops
  labels:
    app: cloudops-api
    app.kubernetes.io/name: cloudops-api
    app.kubernetes.io/part-of: cloudops-enterprise-platform
spec:
  type: ClusterIP
  selector:
    app: cloudops-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
