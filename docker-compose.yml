services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cloudops_db}
      POSTGRES_USER: ${DB_USER:-cloudops_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudops_secure_pass_local}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cloudops_user} -d ${DB_NAME:-cloudops_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # MinIO S3-compatible local object storage (Requires docker login or internal mirror)
  minio:
    image: minio/minio:latest
    container_name: cloudops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    profiles:
      - with-minio

  api:
    image: cloudops-enterprise-platform:latest
    container_name: cloudops-api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_NAME: "CloudOps Enterprise Platform"
      APP_ENV: "production"
      DEBUG: "false"
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local_memory}
      STORAGE_BUCKET_DEFAULT: ${STORAGE_BUCKET_DEFAULT:-cloudops-artifacts}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      DB_BACKEND: ${DB_BACKEND:-postgres}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cloudops_db}
      DB_USER: ${DB_USER:-cloudops_user}
      DB_PASSWORD: ${DB_PASSWORD:-cloudops_secure_pass_local}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: cloudops_postgres_data
  minio_data:
    name: cloudops_minio_data
